[package]
name = "raw-autotune"
version = "0.1.18"
edition = "2024"
rust-version = "1.89"
description = "A small batch RAW developer with deterministic automatic exposure and tone mapping"
license = "AGPL-3.0-or-later"
repository = ""
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rawler = "=0.7.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
