[package]
name = "raw-autotune"
version = "0.1.19"
edition = "2024"
rust-version = "1.89"
description = "A small batch RAW developer with deterministic automatic exposure and tone mapping"
license = "AGPL-3.0-or-later"
repository = ""
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lege-gpu = { path = "../Lege-ecosystem/lege-gpu" }
sha2 = "0.10"
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-encoder = "0.7"
lensfun = "=0.7.0"
linear-srgb = "0.6"
rawler = "=0.7.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[features]
default = ["semantic"]
# Compatibility name for existing build scripts. The dependencies are normal,
# unconditional dependencies; `--semantic` is the runtime opt-in.
semantic = []

[[example]]
name = "probe-scene-model"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# For `tools/flamegraph_profile.py` / `cargo flamegraph`. Same codegen as release
# (opt-level, lto, codegen-units all inherited) but keeps debug info instead of
# stripping it, so perf can resolve stack frames to function names instead of
# raw addresses. `cargo-flamegraph`/`flamegraph` themselves are cargo subcommand
# binaries (`cargo install flamegraph`, already on PATH) with no library crate to
# depend on — this profile is the actual Cargo-side setup profiling needs.
[profile.profiling]
inherits = "release"
debug = true
strip = false
